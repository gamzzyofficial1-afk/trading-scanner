services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scanner
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: scanner
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U scanner -d scanner"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://scanner:scanner@postgres:5432/scanner
      REDIS_URL: redis://redis:6379
      MARKET_DATA_BASE_URL: ${MARKET_DATA_BASE_URL:-}
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports: ["4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
